<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="application-name" content="HiResume" />
    <meta property="og:site_name" content="HiResume" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:site" content="@hiresume_in" />
    <!-- seo:start — per-page tags. Pre-rendered pages replace this block (scripts/prerender.mjs);
         the app shell served for private routes keeps it and adds noindex. -->
    <title>HiResume - Free ATS Resume Checker & AI Mock Interview Platform</title>
    <meta name="description" content="Check your resume's ATS score free in about 15 seconds. AI resume analysis, keyword optimization, resume builder and AI mock interviews for students, freshers and job seekers in India." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HiResume - Free ATS Resume Checker & AI Mock Interview Platform" />
    <meta property="og:description" content="Check your resume's ATS score free in about 15 seconds. AI resume analysis, resume builder and AI mock interviews." />
    <meta property="og:url" content="https://hiresume.in/" />
    <meta property="og:image" content="https://hiresume.in/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ══════════════════════════════════════
         FONTS — Inter (primary), Roboto, Libre Caslon Text, Roboto Mono
         Geist Mono removed (unused). Inter preloaded as critical font.
    ══════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
    </noscript>

    <!-- Site-wide structured data. Page-specific data (FAQ, product, articles) is added by each page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HiResume",
      "alternateName": ["hiresume.in", "HiResume AI"],
      "url": "https://hiresume.in/",
      "inLanguage": "en-IN"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HiResume",
      "url": "https://hiresume.in/",
      "logo": "https://hiresume.in/logo.svg",
      "description": "HiResume is an AI resume checker, resume builder and mock interview platform that helps students and job seekers get past ATS filters and prepare for interviews.",
      "sameAs": ["https://twitter.com/hiresume_in"]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
