name: Apply database migrations

# Manual only: migrations are reviewed in the PR and applied when the owner presses "Run workflow".
# Always shows the dry run first. Needs SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets
# (for staging: STAGING_PROJECT_REF variable and STAGING_DB_PASSWORD secret, once staging exists).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Database"
        type: choice
        options: [production, staging]
        default: production
      apply:
        description: "Apply (unticked = dry run only)"
        type: boolean
        default: false

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.target == 'production' && 'zhfahrrxuguagwbujkiz' || vars.STAGING_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ inputs.target == 'production' && secrets.SUPABASE_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dry run (what would be applied)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply
        if: inputs.apply
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
